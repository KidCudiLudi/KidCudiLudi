<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Fisher RPG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    width: 800px;
    height: 600px;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #hud {
    position: absolute;
    top: 8px; left: 8px;
    pointer-events: none;
  }
  .hud-box {
    background: rgba(0,0,0,0.75);
    border: 2px solid #4a7c59;
    padding: 6px 10px;
    margin-bottom: 4px;
    color: #e8d5a3;
    font-size: 13px;
    line-height: 1.6;
    image-rendering: pixelated;
  }
  .hud-box .label { color: #8fc97a; font-weight: bold; }
  .bar-container {
    width: 160px;
    height: 10px;
    background: #1a1a2e;
    border: 1px solid #333;
    margin: 2px 0;
    display: inline-block;
    vertical-align: middle;
  }
  .bar-fill {
    height: 100%;
    transition: width 0.2s;
  }
  .bar-xp { background: linear-gradient(90deg, #2255aa, #44aaff); }
  .bar-energy { background: linear-gradient(90deg, #aa5500, #ffaa00); }
  #shopPanel, #inventoryPanel, #upgradesPanel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10,10,20,0.97);
    border: 3px solid #4a7c59;
    padding: 20px;
    width: 480px;
    max-height: 520px;
    overflow-y: auto;
    color: #e8d5a3;
    font-size: 13px;
    display: none;
    z-index: 100;
    pointer-events: all;
  }
  .panel-title {
    color: #8fc97a;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #4a7c59;
  }
  .fish-row, .upgrade-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 6px;
    border-bottom: 1px solid #223322;
    gap: 8px;
  }
  .fish-row:hover, .upgrade-row:hover { background: rgba(74,124,89,0.15); }
  .fish-emoji { font-size: 22px; width: 30px; text-align: center; }
  .fish-info { flex: 1; }
  .fish-name { color: #c8e6c9; font-weight: bold; }
  .fish-detail { color: #777; font-size: 11px; }
  .sell-btn, .buy-btn, .close-btn {
    background: #1a3a1a;
    border: 2px solid #4a7c59;
    color: #8fc97a;
    padding: 4px 12px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    pointer-events: all;
    transition: background 0.15s;
  }
  .sell-btn:hover, .buy-btn:hover { background: #2a5a2a; }
  .sell-btn:active, .buy-btn:active { background: #3a7a3a; }
  .close-btn {
    display: block;
    margin: 14px auto 0;
    padding: 6px 24px;
    border-color: #7c4a4a;
    color: #c97a7a;
  }
  .close-btn:hover { background: #3a1a1a; }
  #messageLog {
    position: absolute;
    bottom: 8px; left: 8px; right: 8px;
    pointer-events: none;
  }
  .msg {
    background: rgba(0,0,0,0.7);
    border-left: 3px solid #4a7c59;
    color: #e8d5a3;
    padding: 3px 8px;
    font-size: 12px;
    margin-bottom: 2px;
    opacity: 1;
    transition: opacity 0.5s;
  }
  .msg.fade { opacity: 0; }
  #actionBar {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    pointer-events: all;
  }
  .action-btn {
    background: rgba(10,20,10,0.9);
    border: 2px solid #4a7c59;
    color: #8fc97a;
    padding: 8px 16px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    transition: background 0.15s, border-color 0.15s;
  }
  .action-btn:hover { background: rgba(74,124,89,0.3); border-color: #8fc97a; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn.active { background: rgba(74,124,89,0.5); border-color: #aff0a0; color: #aff0a0; }
  #castBtn {
    background: rgba(10,10,40,0.9);
    border-color: #4a5c9c;
    color: #7a9cff;
    font-size: 14px;
    padding: 10px 24px;
  }
  #castBtn:hover { background: rgba(74,84,156,0.3); }
  #castBtn.casting { border-color: #ffaa00; color: #ffaa00; animation: pulse 0.5s infinite alternate; }
  #castBtn.reeling { border-color: #ff4444; color: #ff4444; animation: pulse 0.3s infinite alternate; }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
  .rarity-common { color: #aaaaaa; }
  .rarity-uncommon { color: #55cc55; }
  .rarity-rare { color: #5588ff; }
  .rarity-epic { color: #aa55ff; }
  .rarity-legendary { color: #ffaa00; }
  .upgrade-icon { font-size: 20px; width: 30px; }
  .upgrade-info { flex: 1; }
  .upgrade-name { color: #c8e6c9; font-weight: bold; }
  .upgrade-desc { color: #777; font-size: 11px; }
  .upgrade-level { color: #ffaa55; font-size: 11px; }
  #notification {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    border: 3px solid #ffaa00;
    color: #ffaa00;
    padding: 16px 32px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 200;
    text-align: center;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0a0f; }
  ::-webkit-scrollbar-thumb { background: #4a7c59; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div id="hud">
    <div class="hud-box" id="playerHud"></div>
  </div>

  <div id="actionBar">
    <button class="action-btn" id="inventoryBtn">🎒 Ekwipunek</button>
    <button class="action-btn" id="castBtn">🎣 Zarzuć wędkę</button>
    <button class="action-btn" id="shopBtn">🏪 Sklep</button>
    <button class="action-btn" id="upgradesBtn">⚔️ Ulepszenia</button>
  </div>

  <div id="inventoryPanel">
    <div class="panel-title">🎒 EKWIPUNEK</div>
    <div id="inventoryContent"></div>
    <button class="close-btn" onclick="closeAllPanels()">[ ZAMKNIJ ]</button>
  </div>

  <div id="shopPanel">
    <div class="panel-title">🏪 SKLEP RYBAKA</div>
    <div id="shopContent"></div>
    <button class="close-btn" onclick="closeAllPanels()">[ ZAMKNIJ ]</button>
  </div>

  <div id="upgradesPanel">
    <div class="panel-title">⚔️ ULEPSZENIA</div>
    <div id="upgradesContent"></div>
    <button class="close-btn" onclick="closeAllPanels()">[ ZAMKNIJ ]</button>
  </div>

  <div id="messageLog"></div>
  <div id="notification"></div>
</div>

<script src="game.js"></script>
</body>
</html>
